# Local development stack: Authentik (auth) + Postgres.
#
# The app and Authentik share one Postgres server with separate databases
# (`fabric_sync` for the app, `authentik` for Authentik) — a second Postgres
# service is deliberately not run.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d --wait
#
# Authentik admin UI: http://localhost:9000/if/flow/initial-setup/ (first boot)
# Postgres:           postgres://postgres:postgres@localhost:5432/fabric_sync
#
# Migrating from the old Zitadel stack needs a fresh volume
# (`docker compose down && docker volume rm fabric-sync_postgres-data`).

name: fabric-sync

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      # The default database, auto-created by the entrypoint. Authentik
      # connects to it (see AUTHENTIK_POSTGRESQL__NAME); the app's
      # `fabric_sync` database is created alongside it by
      # docker/postgres-init.sql.
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PUBLISHED_PORT}:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_ADMIN_USER}
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 20s
    volumes:
      # 18+ images store data at major-version-specific subdirectories under
      # /var/lib/postgresql (not /var/lib/postgresql/data as in 17 and
      # earlier) to support pg_upgrade --link; see
      # https://github.com/docker-library/postgres/pull/1259
      - postgres-data:/var/lib/postgresql:rw
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/fabric_sync-init.sql:ro
    networks:
      - authentik

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION}
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_ADMIN_USER}
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    ports:
      - ${AUTHENTIK_HTTP_PUBLISHED_PORT}:9000
      - ${AUTHENTIK_HTTPS_PUBLISHED_PORT}:9443
    healthcheck:
      test:
        - CMD
        - ak
        - healthcheck
      interval: 30s
      timeout: 10s
      retries: 5
      # First boot runs database migrations and warms the app (~60-90s)
      # before reporting healthy.
      start_period: 120s
    volumes:
      - authentik-media:/media:rw
    networks:
      - authentik
    depends_on:
      postgres:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION}
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_ADMIN_USER}
      AUTHENTIK_POSTGRESQL__NAME: ${POSTGRES_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    healthcheck:
      test:
        - CMD
        - ak
        - healthcheck
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - authentik-media:/media:rw
      - authentik-certs:/certs:rw
    networks:
      - authentik
    depends_on:
      postgres:
        condition: service_healthy

networks:
  authentik:
    name: fabric-sync

volumes:
  postgres-data:
  authentik-media:
  authentik-certs:
