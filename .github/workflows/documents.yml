name: Invoice documents

on:
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose*.yml"
      - "frontend/public/designs/**"
      - "scripts/fabric-designs/**"
      - ".github/workflows/documents.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose*.yml"
      - "frontend/public/designs/**"
      - "scripts/fabric-designs/**"
      - ".github/workflows/documents.yml"

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fabric_sync
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10
      renderer:
        image: gotenberg/gotenberg:8.38.0@sha256:c36cdd730893e3941d27a196ff8b68675e473642d067ec7ee3668b9adaa37b75
        ports: ["53000:3000"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fabric_sync
      SQLX_OFFLINE: "true"
      DOCUMENT_RENDERER_TEST_URL: http://localhost:53000
      DOCUMENT_RENDERER_TEST_OUTPUT: /tmp/fabric-sync-invoice.pdf
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Render bilingual multi-page invoice with real Chromium
        run: cargo test real_chromium -- --ignored
      - name: Check PDF content, pagination and embedded Arabic font
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdfinfo /tmp/fabric-sync-invoice.pdf
          pages=$(pdfinfo /tmp/fabric-sync-invoice.pdf | awk '/^Pages:/ {print $2}')
          test "$pages" -gt 1
          pdftotext -layout /tmp/fabric-sync-invoice.pdf /tmp/fabric-sync-invoice.txt
          grep -q 'INV-' /tmp/fabric-sync-invoice.txt
          # The fixture has 30 unpaid BHD 100 orders. Match the amount beside
          # its label so a value in another totals row/column cannot satisfy it.
          grep -Eq 'BHD[[:space:]]+3000[.]000[[:space:]]+Balance[[:space:]]+due([[:space:]]|$)' /tmp/fabric-sync-invoice.txt
          for page in $(seq 1 "$pages"); do
            pdftotext -f "$page" -l "$page" /tmp/fabric-sync-invoice.pdf - | grep -Eq "INV-.*Page[[:space:]]+${page}[[:space:]]*/[[:space:]]*${pages}([[:space:]]|$)"
          done
          pdffonts /tmp/fabric-sync-invoice.pdf | grep -i NotoSansArabic
