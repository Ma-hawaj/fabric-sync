<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <!-- Original footer icon artwork. -->
    <g id="instagram-icon" fill="#1a1a1a" transform="translate(-323.73 -1809.3)"><path d="M330.58,1825.2h-13.7a9.06,9.06,0,0,1-9.05-9v-13.7a9.06,9.06,0,0,1,9.05-9h13.7a9.06,9.06,0,0,1,9.05,9v13.7A9.06,9.06,0,0,1,330.58,1825.2Zm-13.7-29.07a6.33,6.33,0,0,0-6.32,6.32v13.7a6.33,6.33,0,0,0,6.32,6.33h13.7a6.34,6.34,0,0,0,6.32-6.33v-13.7a6.33,6.33,0,0,0-6.32-6.32Z" /><path d="M323.73,1817.44a8.14,8.14,0,1,1,8.14-8.14A8.15,8.15,0,0,1,323.73,1817.44Zm0-13.55a5.42,5.42,0,1,0,5.42,5.41A5.42,5.42,0,0,0,323.73,1803.89Z" /><path d="M334.18,1800.7a2,2,0,1,1-2-2A2,2,0,0,1,334.18,1800.7Z" /></g>
    <g id="whatsapp-icon" fill="#1a1a1a" transform="translate(-582.84 -1809.3)" fill-rule="evenodd"><path d="M582.84,1793.26H580.1c-9,1.33-14.14,6.47-15.62,15.29V1812c1.61,9.16,6.95,14.59,16.95,15.37h.16c10.07-.82,15.46-6.32,16.95-15.71V1809Q596.55,1795.27,582.84,1793.26Zm13.46,18.36a14.58,14.58,0,0,1-9.14,12.38,15.06,15.06,0,0,1-16-3.07,15.23,15.23,0,0,1-3.49-16,14.87,14.87,0,0,1,4.57-6.15,14.12,14.12,0,0,1,7.72-3.15,14.8,14.8,0,0,1,16.37,16Z" /><path d="M591.06,1817.27a4.72,4.72,0,0,1-2.49,2.58c-2.05.59-5.54-.6-7.06-1.25a15.54,15.54,0,0,1-9.3-11.71,8.73,8.73,0,0,1-.25-3.74,4.48,4.48,0,0,1,2.74-2.41,2.67,2.67,0,0,1,2.74,1.16,8.65,8.65,0,0,1,1,4.16c-.15,1.08-1,1.39-1.49,2.24a9.93,9.93,0,0,0,6.48,6.56c.9-.38,1.18-1.33,2.33-1.49a8.75,8.75,0,0,1,4.48,1.24A2.93,2.93,0,0,1,591.06,1817.27Z" /></g>
    <style>.cls-1{fill:none}.cls-3{fill:url(#radial-gradient)}.cls-4{fill:url(#radial-gradient-2)}.cls-5{fill:url(#radial-gradient-3)}.cls-6{fill:url(#radial-gradient-4)}.cls-7{fill:url(#radial-gradient-5)}.cls-8{fill:url(#radial-gradient-6)}.cls-9{fill:url(#radial-gradient-7)}.cls-10{fill:url(#radial-gradient-8)}.cls-11{fill:url(#radial-gradient-9)}.cls-12{fill:url(#radial-gradient-10)}.cls-13{fill:url(#radial-gradient-11)}.cls-14{fill:url(#radial-gradient-12)}.cls-15{fill:url(#radial-gradient-13)}</style>
    <clipPath id="clip-path" clipPathUnits="userSpaceOnUse">
      <rect x="1206.34" y="1697.59" width="1081" height="1921" fill="#000" />
    </clipPath>
    <radialGradient id="radial-gradient" cx="1746.84" cy="2389.31" fx="1526.9723764358869" fy="2293.038524538804" r="337.65" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" />
      <stop offset="0.31" stop-color="#fff" stop-opacity="0.59" />
      <stop offset="0.64" stop-color="#fff" stop-opacity="0.17" />
      <stop offset="0.79" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="radial-gradient-2" cx="1480.76" cy="2188.95" fx="1260.8898569046373" fy="2092.680417205759" r="337.65" xlink:href="#radial-gradient" />
    <radialGradient id="radial-gradient-3" cx="1986.65" cy="2223.91" fx="1766.775110810888" fy="2127.633543735707" r="337.65" xlink:href="#radial-gradient" />
    <radialGradient id="radial-gradient-4" cx="2103.9" cy="2343.86" fx="1884.027575377557" fy="2247.5883533465353" r="337.65" xlink:href="#radial-gradient" />
    <radialGradient id="radial-gradient-5" cx="1461.5" cy="2389.31" fx="1241.6293019580476" r="337.65" xlink:href="#radial-gradient" />
    <radialGradient id="radial-gradient-6" cx="2094.68" cy="2502.49" fx="1874.8065475294284" fy="2406.2165151145446" r="337.65" xlink:href="#radial-gradient" />
    <radialGradient id="radial-gradient-7" cx="1674" cy="2516.86" fx="1454.124010394636" fy="2420.5894984181564" r="337.65" xlink:href="#radial-gradient" />
    <radialGradient id="radial-gradient-8" cx="1858.05" cy="2484.67" fx="1638.1810565460967" fy="2388.393761208296" r="337.65" xlink:href="#radial-gradient" />
    <radialGradient id="radial-gradient-9" cx="1206.34" cy="3256.35" fx="859.711937349467" fy="3104.578887363594" r="532.31" xlink:href="#radial-gradient" />
    <radialGradient id="radial-gradient-10" cx="1335.37" cy="1440.69" fx="988.7421312068506" fy="1288.9129514450995" r="532.31" gradientTransform="matrix(1, 0, 0, -1, -463.07, 2881.38)" xlink:href="#radial-gradient" />
    <radialGradient id="radial-gradient-11" cx="1246.41" cy="1409.87" fx="899.7789580322797" fy="1258.092075764622" r="532.31" gradientTransform="matrix(1, 0, 0, -1, -285.14, 2819.73)" xlink:href="#radial-gradient" />
    <radialGradient id="radial-gradient-12" cx="1393.5" cy="1216.62" fx="1046.8646898106595" fy="1064.8450101765206" r="532.31" gradientTransform="matrix(1, 0, 0, -1, -579.31, 2433.24)" xlink:href="#radial-gradient" />
    <radialGradient id="radial-gradient-13" cx="3019.19" cy="1081.91" fx="2672.556460285377" fy="930.1379789135077" r="532.31" gradientTransform="translate(-1374.28 1698.09)" xlink:href="#radial-gradient" />
    <image id="image" width="4058" height="8742" xlink:href="{{ background }}" />
  </defs>
  <rect width="1080" height="1920" fill="#fff" />
  <g id="designer-background" transform="translate(-1206.84 -1698.09)">
    <g clip-path="url(#clip-path)">
      <use transform="translate(1203.61 1843.4) scale(0.27)" xlink:href="#image" />
      <use transform="translate(2290.08 2340.55) rotate(180) scale(0.27)" xlink:href="#image" />
    </g>
    <g clip-path="url(#clip-path)">
      <rect class="cls-3" x="1062.82" y="2075.08" width="1368.05" height="628.45" />
      <rect class="cls-4" x="796.74" y="1874.73" width="1368.05" height="628.45" />
      <rect class="cls-5" x="1302.62" y="1909.68" width="1368.05" height="628.45" />
      <rect class="cls-6" x="1419.87" y="2029.63" width="1368.05" height="628.45" />
      <rect class="cls-7" x="777.48" y="2075.08" width="1368.05" height="628.45" />
      <rect class="cls-8" x="1410.65" y="2188.26" width="1368.05" height="628.45" />
      <rect class="cls-9" x="989.97" y="2202.63" width="1368.05" height="628.45" />
      <rect class="cls-10" x="1174.03" y="2170.44" width="1368.05" height="628.45" />
      <rect class="cls-11" x="127.96" y="2760.97" width="2156.76" height="990.77" />
      <rect class="cls-12" x="-206.07" y="945.3" width="2156.76" height="990.77" transform="translate(2951.46 4579.46) rotate(-180)" />
      <rect class="cls-13" x="-117.11" y="914.48" width="2156.76" height="990.77" transform="translate(3129.38 4517.82) rotate(-180)" />
      <rect class="cls-14" x="-264.2" y="721.24" width="2156.76" height="990.77" transform="translate(2835.21 4131.33) rotate(-180)" />
      <rect class="cls-15" x="566.53" y="2284.62" width="2156.76" height="990.77" />
    </g>
  </g>

  <!-- Company branding uses the same COMPANY_* settings as invoices. -->
  {% if logo %}
  <image id="company-logo" x="330" y="96" width="420" height="190" href="{{ logo }}" preserveAspectRatio="xMidYMid meet"/>
  {% else %}
  <text x="540" y="220" text-anchor="middle" font-family="thmanyah serif display" font-size="{{ brand_size }}" font-weight="700" fill="#907b29">{{ brand }}</text>
  {% if brand_ar %}<text x="540" y="280" text-anchor="middle" direction="rtl" font-family="thmanyah serif display" font-size="{{ brand_ar_size }}" fill="#907b29">{{ brand_ar }}</text>{% endif %}
  {% endif %}

  <g text-anchor="middle" font-family="thmanyah serif display">
    <text x="540" y="451" direction="rtl" font-size="70" font-weight="700" fill="#1a1a1a">لأنك غالي</text>
    <text x="540" y="570" direction="rtl" font-size="68" font-weight="700" fill="#907b29">تستاهل فخامة ثوبكس!&#x200F;</text>
    <text x="540" y="718" direction="rtl" font-size="54" font-weight="900" fill="#907b29">هدية خاصة لك من ثوبكس!&#x200F;</text>
    <text x="540" y="792" font-size="48" font-weight="900" fill="#907b29">a special gift just for you!</text>
    <text id="recipient" x="540" y="858" direction="{{ recipient_direction }}" font-size="{{ recipient_size }}" font-weight="700" fill="#907b29">{{ recipient }}</text>

    <text id="balance" x="350" y="984" font-size="{{ balance_size }}" font-weight="700" fill="#907b29">{{ balance }}</text>
    <text x="350" y="1024" font-family="Space Grotesk" font-size="28" font-weight="500" fill="#907b29">{{ currency }}</text>
    <text x="775" y="950" direction="rtl" font-size="52" fill="#1a1a1a">قيمة الهدية</text>
    <text x="775" y="1015" font-size="46" fill="#1a1a1a">Gift Value</text>

    <text x="350" y="1152" direction="rtl" font-size="52" fill="#1a1a1a">رقم البطاقة</text>
    <text x="350" y="1223" font-size="49" fill="#1a1a1a">Gift #</text>
    <text id="code" x="350" y="1292" font-family="DejaVu Sans Mono" font-size="{{ code_size }}" fill="#1a1a1a">{{ code }}</text>
    <text x="810" y="1152" direction="rtl" font-size="52" fill="#1a1a1a">صالحة حتى</text>
    <text x="810" y="1223" font-size="46" fill="#1a1a1a">Valid Until</text>
    <text id="expiry" x="810" y="1292" font-family="Space Grotesk" font-size="{{ expiry_size }}" font-weight="500" fill="#1a1a1a">{{ expiry }}</text>
  </g>
  <g fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="7 7">
    <path d="M110 1058H970 M110 1320H590 M650 1320H970"/>
  </g>

  {% if status %}
  <g id="card-status">
    <rect x="180" y="1350" width="720" height="64" rx="12" fill="#fff7ee" stroke="#9c2e24" stroke-width="2"/>
    <text x="540" y="1393" text-anchor="middle" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#9c2e24">{{ status }}</text>
  </g>
  {% endif %}

  <!-- The four-module quiet zone is part of qr_size and qr_path. -->
  <g id="redemption-qr">
    <rect x="786" y="1440" width="216" height="216" rx="12" fill="#fff"/>
    <svg x="792" y="1446" width="204" height="204" viewBox="0 0 {{ qr_size }} {{ qr_size }}">
      <rect width="{{ qr_size }}" height="{{ qr_size }}" fill="#fff"/>
      <path d="{{ qr_path }}" fill="#1a1a1a"/>
    </svg>
    <text x="894" y="1690" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#1a1a1a">SCAN TO READ CODE</text>
  </g>

  <g font-family="Space Grotesk" font-weight="500" fill="#1a1a1a" text-anchor="middle">
    {% if phone %}
    <use href="#instagram-icon" x="245" y="1809.3"/>
    <text x="365" y="1824" font-size="38">thobx.bh</text>
    <use href="#whatsapp-icon" x="620" y="1809.3"/>
    <text x="750" y="1824" font-size="{{ phone_size }}">{{ phone }}</text>
    {% else %}
    <use href="#instagram-icon" x="420" y="1809.3"/>
    <text x="540" y="1824" font-size="38">thobx.bh</text>
    {% endif %}
  </g>
</svg>
