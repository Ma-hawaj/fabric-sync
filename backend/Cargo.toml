[package]
name = "fabric_sync"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
axum = "0.7"
base64 = "0.23.0"
chrono = { version = "0.4", features = ["serde"] }
minijinja = { version = "2.21.0", features = ["loader"] }
oauth2 = "5.0.0"
openidconnect = "4.0.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "chrono", "macros", "uuid", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
serde_json = "1"
