[package]
name = "fabric_sync"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
oauth2 = "5.0.0"
openidconnect = "4.0.1"
serde = { version = "1", features = ["derive"] }
# Needed at runtime, not just in tests: the `sort` and `filters` query params are
# JSON documents (see `list`), so they are parsed on every list request.
serde_json = "1"
sqlx ={ version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "chrono", "macros", "uuid", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
# Lets the list-params tests build a request from a real query string rather
# than hand-constructing the struct they are meant to be checking.
serde_urlencoded = "0.7"
